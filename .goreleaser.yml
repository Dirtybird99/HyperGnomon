# GoReleaser configuration for HyperGnomon
# Run:  goreleaser release --clean
# Docs: https://goreleaser.com/customization/

version: 2

project_name: hypergnomon

before:
  hooks:
    - go mod tidy

builds:
  - id: hypergnomon
    main: ./cmd/hypergnomon
    binary: hypergnomon
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X github.com/hypergnomon/hypergnomon/structures.Version={{.Version}}
    mod_timestamp: "{{ .CommitTimestamp }}"

  # wstest is a small WS smoke-test CLI bundled in the archive so operators
  # can exercise the subscribe API against a running node without building
  # from source. Not the primary binary.
  - id: wstest
    main: ./cmd/wstest
    binary: wstest
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
    mod_timestamp: "{{ .CommitTimestamp }}"

  # benchvs is the single-target head-to-head bench harness
  # (see cmd/benchvs/README.md). Bundled so operators can run
  # the comparison against their own daemon without a `go build`.
  - id: benchvs
    main: ./cmd/benchvs
    binary: benchvs
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - id: default
    ids:
      - hypergnomon
      - wstest
      - benchvs
    formats: ["tar.gz"]
    name_template: >-
      {{ .ProjectName }}_
      {{- .Version }}_
      {{- .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
    format_overrides:
      - goos: windows
        formats: ["zip"]
    files:
      - LICENSE*
      - README*
      - SECURITY*
      - DESIGN*
      - CHANGELOG*
      - DOCS/MIGRATION_FROM_GNOMON.md
      - DOCS/FLAGS.md
      - DOCS/BENCHMARKS.md

checksum:
  name_template: "checksums.txt"
  algorithm: sha256

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  use: github
  groups:
    - title: "🚀 Features"
      regexp: '^.*?feat(\([[:word:]]+\))??!?:.+$'
      order: 0
    - title: "⚡ Performance"
      regexp: '^.*?perf(\([[:word:]]+\))??!?:.+$'
      order: 1
    - title: "🐛 Bug Fixes"
      regexp: '^.*?fix(\([[:word:]]+\))??!?:.+$'
      order: 2
    - title: "📚 Documentation"
      regexp: '^.*?docs(\([[:word:]]+\))??!?:.+$'
      order: 3
    - title: "🧪 Tests"
      regexp: '^.*?test(\([[:word:]]+\))??!?:.+$'
      order: 4
    - title: "📊 Benchmarks"
      regexp: '^.*?bench(\([[:word:]]+\))??!?:.+$'
      order: 5
    - title: "🔧 Maintenance"
      regexp: '^.*?(chore|ci|build)(\([[:word:]]+\))??!?:.+$'
      order: 6
    - title: Others
      order: 999
  filters:
    exclude:
      - "^Merge pull request"
      - "^Merge branch"
      - "typo"

release:
  draft: false
  prerelease: auto
  mode: append
  header: |
    ## HyperGnomon {{ .Tag }}

    Arena-accelerated DERO blockchain indexer. Byte-correct TELA
    content server, WebSocket push API, civilware/Gnomon-shape Go
    library for embedding. See README.md §4 for the comparison table
    and DOCS/BENCHMARKS.md for methodology behind every number.

    ### Install (pre-built archive)
    ```
    tar -xzf hypergnomon_{{ trimprefix .Tag "v" }}_<os>_<arch>.tar.gz
    ./hypergnomon --daemon-rpc-address=127.0.0.1:10102 --fastsync
    ```

    ### Install (go install)
    ```
    go install github.com/hypergnomon/hypergnomon/cmd/hypergnomon@{{ .Tag }}
    ```

    ### Migrate from civilware/Gnomon (Go library embedders)
    Three sed commands + one constructor swap —
    see `DOCS/MIGRATION_FROM_GNOMON.md`.
  footer: |
    **Full Changelog**: {{ .GitURL }}/compare/{{ .PreviousTag }}...{{ .Tag }}
