version: "2"
run:
  modules-download-mode: readonly
  issues-exit-code: 1
  tests: true
output:
  formats:
    text:
      path: stdout
      print-linter-name: true
      print-issued-lines: true

# Linter selection for a pre-1.0 indexer release.
#
# Enabled: catches real bugs (errcheck, govet sans-shadow, staticcheck,
# bodyclose, errorlint, copyloopvar, nilerr) and basic hygiene
# (misspell, whitespace, unconvert, unused, predeclared).
#
# Disabled (documented reasons, not "just because"):
#   - gosec          — current findings are mostly G115 int<->uint for
#                      block heights (DERO heights are always 0..<2^62,
#                      so conversions are safe in practice). Requires a
#                      dedicated security audit with context before
#                      flipping on, not blanket suppression.
#   - godot          — trailing periods on comments. Cosmetic only.
#   - gocognit/gocyclo — complexity linters; subjective thresholds.
#   - gocritic       — opinionated suggestions; many false positives on
#                      idiomatic Go.
#   - nestif/nilnil  — pre-existing structural code; refactor is its own
#                      PR track.
#   - dupl/exhaustive/prealloc/unparam/revive — noise vs signal ratio
#                      too low for first release. Revisit post-v1.0.
#   - usetesting/tparallel/sqlclosecheck/noctx/contextcheck/errname
#                    — marginal signal on this codebase; enable when
#                      structural patterns stabilize.
#
# If adding back: fix every reported issue in the same PR, no silent
# suppressions.
linters:
  enable:
    - bodyclose
    - copyloopvar
    - errcheck
    - errorlint
    - misspell
    - nilerr
    - predeclared
    - staticcheck
    - unconvert
    - whitespace
  settings:
    errcheck:
      # check-blank / check-type-assertions would be strict but generate
      # many false positives on idiomatic json encode and the DERO RPC
      # surface. Leave defaults.
      exclude-functions:
        - io.Copy
        - io.WriterTo.WriteTo
        - (*encoding/json.Encoder).Encode
        - (net/http.ResponseWriter).Write
        - github.com/gorilla/websocket.(*Conn).WriteJSON
    govet:
      disable:
        # shadow: noisy on idiomatic `if err := ...; err != nil` patterns
        # inside tx.Update closures. Re-enable when those are refactored.
        - shadow
        - fieldalignment
      enable-all: true
    misspell:
      locale: US
    staticcheck:
      checks:
        - all
        - -ST1000
        - -ST1003
      dot-import-whitelist:
        - github.com/onsi/ginkgo/v2
        - github.com/onsi/gomega
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - linters:
          - errcheck
        path: _test\.go
      - linters:
          - all
        path: .*\.pb\.go
    paths:
      - third_party$
      - builtin$
      - examples$
issues:
  max-issues-per-linter: 50
  max-same-issues: 10
  new: false
severity:
  default: warning
  rules:
    - linters:
        - errcheck
      severity: error
formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/hypergnomon/hypergnomon
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
